name: ngumbah

services:
  floci:
    image: floci/floci:2.3.0
    profiles: [infra]
    # Root is required to drive the host Docker socket for Lambda and RDS containers
    user: root
    ports:
      - "${FLOCI_PORT:-4566}:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - floci-data:/app/data
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    healthcheck:
      # Image ships a bash-only probe because it has no curl or wget
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    restart: unless-stopped

  postgres:
    image: postgres:17.11-alpine3.24
    profiles: [infra]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    # Passes NGUMBAH_SERVICES and per-service passwords to the init script
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8.1.10-alpine3.24
    profiles: [infra]
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 192m
    restart: unless-stopped

  tenant-svc:
    profiles: [core]
    build:
      context: ../ngumbah-tenant-svc
    ports:
      - "${TENANT_SVC_PORT:-50051}:50051"
    environment:
      TENANT_SVC_GRPC_ADDR: ":50051"
      TENANT_SVC_DATABASE_URL: "postgres://tenant_svc:${TENANT_SVC_DB_PASSWORD}@postgres:5432/tenant_db?sslmode=disable"
      # Development mode applies migrations on start and enables reflection
      TENANT_SVC_ENV: development
      TENANT_SVC_LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 128m
    restart: unless-stopped

  gateway:
    profiles: [core]
    build:
      context: ../ngumbah-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      GATEWAY_HTTP_ADDR: ":8080"
      GATEWAY_TENANT_SVC_ADDR: "tenant-svc:50051"
      GATEWAY_CORS_ORIGINS: "http://localhost:5173"
      # Development mode enables the playground and introspection
      GATEWAY_ENV: development
      GATEWAY_LOG_LEVEL: info
    depends_on:
      tenant-svc:
        condition: service_healthy
    mem_limit: 128m
    restart: unless-stopped

volumes:
  floci-data:
  postgres-data:
  valkey-data:
